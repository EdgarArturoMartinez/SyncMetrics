name: Docker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t syncmetrics-pipeline:${{ github.sha }} .

      - name: Verify image runs
        run: |
          docker run --rm syncmetrics-pipeline:${{ github.sha }} --help || true
          echo "Docker image built and verified successfully"
